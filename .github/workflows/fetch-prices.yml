name: Fetch Amayama prices

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1,4'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch prices
        id: fetch
        continue-on-error: true
        run: python fetch_prices.py --input parts.txt --output output.json

      - name: Commit latest JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Amayama prices"
            git push
          fi

      - name: Fail workflow if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
